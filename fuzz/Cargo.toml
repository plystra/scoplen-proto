[package]
name = "scoplen-proto-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.7"
scoplen-test-vectors = { path = "../crates/scoplen-test-vectors" }
scoplen-model = { path = "../crates/scoplen-model" }
scoplen-crypto = { path = "../crates/scoplen-crypto" }
scoplen-ssh = { path = "../crates/scoplen-ssh" }

[[bin]]
name = "vector_loader"
path = "fuzz_targets/vector_loader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "object_decoder"
path = "fuzz_targets/object_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crypto_decoders"
path = "fuzz_targets/crypto_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_decoder"
path = "fuzz_targets/agent_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sftp_decoder"
path = "fuzz_targets/sftp_decoder.rs"
test = false
doc = false
bench = false
