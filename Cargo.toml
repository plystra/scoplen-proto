[workspace]
resolver = "2"
members = [
    "crates/scoplen-ssh",
    "crates/scoplen-model",
    "crates/scoplen-crypto",
    "crates/scoplen-api",
    "crates/scoplen-test-vectors",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Scoplen maintainers"]

[workspace.dependencies]
thiserror = "2.0.12"
unicode-normalization = "0.1.24"
uuid = { version = "=1.16.0", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[patch.crates-io]
# pageant 0.2.2 is the last russh-compatible release, but its published source uses let-chains
# while declaring Rust 1.85 support. Keep the tiny MSRV fix local until upstream publishes it.
pageant = { path = "vendor/pageant" }
