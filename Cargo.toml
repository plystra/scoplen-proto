[workspace]
resolver = "2"
members = [
    "crates/scoplen-ssh",
    "crates/scoplen-model",
    "crates/scoplen-crypto",
    "crates/scoplen-api",
    "crates/scoplen-test-vectors",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Scoplen maintainers"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

\n