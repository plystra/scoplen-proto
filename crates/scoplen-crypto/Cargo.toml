[package]
name = "scoplen-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen's reviewed cryptographic formats and key operations."

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.1.1"
getrandom = "0.3.4"
hpke = "0.11.0"
hkdf = "0.12.4"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand_core = "0.6.4"
scoplen-model = { path = "../scoplen-model", version = "0.1.0" }
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror.workspace = true
uuid.workspace = true
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
scoplen-test-vectors = { path = "../scoplen-test-vectors", version = "0.1.0" }

[lints]
workspace = true
